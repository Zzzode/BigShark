syntax = "proto3";

package bigshark.engine.v1;

import "buf/validate/validate.proto";

enum GameVariant {
  GAME_VARIANT_UNSPECIFIED = 0;
  GAME_VARIANT_NLHE = 1;
}

enum BettingStructure {
  BETTING_STRUCTURE_UNSPECIFIED = 0;
  BETTING_STRUCTURE_NO_LIMIT = 1;
}

enum GameType {
  GAME_TYPE_UNSPECIFIED = 0;
  GAME_TYPE_CASH = 1;
  GAME_TYPE_TOURNAMENT = 2;
}

enum Rank {
  RANK_UNSPECIFIED = 0;
  RANK_TWO = 1;
  RANK_THREE = 2;
  RANK_FOUR = 3;
  RANK_FIVE = 4;
  RANK_SIX = 5;
  RANK_SEVEN = 6;
  RANK_EIGHT = 7;
  RANK_NINE = 8;
  RANK_TEN = 9;
  RANK_JACK = 10;
  RANK_QUEEN = 11;
  RANK_KING = 12;
  RANK_ACE = 13;
}

enum Suit {
  SUIT_UNSPECIFIED = 0;
  SUIT_SPADES = 1;
  SUIT_HEARTS = 2;
  SUIT_DIAMONDS = 3;
  SUIT_CLUBS = 4;
}

enum Street {
  STREET_UNSPECIFIED = 0;
  STREET_PREFLOP = 1;
  STREET_FLOP = 2;
  STREET_TURN = 3;
  STREET_RIVER = 4;
  STREET_SHOWDOWN = 5;
}

enum PlayerStatus {
  PLAYER_STATUS_UNSPECIFIED = 0;
  PLAYER_STATUS_ACTIVE = 1;
  PLAYER_STATUS_FOLDED = 2;
  PLAYER_STATUS_ALL_IN = 3;
}

enum ForcedContributionType {
  FORCED_CONTRIBUTION_TYPE_UNSPECIFIED = 0;
  FORCED_CONTRIBUTION_TYPE_SMALL_BLIND = 1;
  FORCED_CONTRIBUTION_TYPE_BIG_BLIND = 2;
  FORCED_CONTRIBUTION_TYPE_ANTE = 3;
  FORCED_CONTRIBUTION_TYPE_BUTTON_ANTE = 4;
  FORCED_CONTRIBUTION_TYPE_DEAD_BLIND = 5;
  FORCED_CONTRIBUTION_TYPE_STRADDLE = 6;
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_FOLD = 1;
  ACTION_TYPE_CHECK = 2;
  ACTION_TYPE_CALL = 3;
  ACTION_TYPE_BET = 4;
  ACTION_TYPE_RAISE = 5;
}

enum SolverMode {
  SOLVER_MODE_UNSPECIFIED = 0;
  SOLVER_MODE_AUTOMATIC = 1;
  SOLVER_MODE_HEURISTIC = 2;
  SOLVER_MODE_RIVER_LP = 3;
  SOLVER_MODE_RIVER_DCFR = 4;
  SOLVER_MODE_MULTISTREET_CFR = 5;
  // Negotiated minor 1 only: lookup a resident offline blueprint.
  SOLVER_MODE_BLUEPRINT = 6;
  // Registered for wire stability; resolving is a later stage and is always
  // rejected in this version.
  SOLVER_MODE_RESOLVING = 7;
}

enum SolverSource {
  SOLVER_SOURCE_UNSPECIFIED = 0;
  SOLVER_SOURCE_PREFLOP_CHART = 1;
  SOLVER_SOURCE_POSTFLOP_HEURISTIC = 2;
  SOLVER_SOURCE_RIVER_LP = 3;
  SOLVER_SOURCE_RIVER_DCFR = 4;
  SOLVER_SOURCE_MULTISTREET_CFR = 5;
  // Negotiated minor 1 only: an immutable resident blueprint row.
  SOLVER_SOURCE_BLUEPRINT = 6;
  // Registered for wire stability; resolving is a later stage.
  SOLVER_SOURCE_RESOLVING = 7;
}

enum FeatureSupport {
  FEATURE_SUPPORT_UNSPECIFIED = 0;
  FEATURE_SUPPORT_UNSUPPORTED = 1;
  FEATURE_SUPPORT_EXPERIMENTAL = 2;
  FEATURE_SUPPORT_SUPPORTED = 3;
}

enum AmountSemantics {
  AMOUNT_SEMANTICS_UNSPECIFIED = 0;
  AMOUNT_SEMANTICS_TARGET_TOTAL_INCLUSIVE = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_UNSUPPORTED_PROTOCOL = 2;
  ERROR_CODE_UNSUPPORTED_GAME = 3;
  ERROR_CODE_UNSUPPORTED_FEATURE = 4;
  ERROR_CODE_NO_DECISION = 5;
  ERROR_CODE_DEADLINE_EXCEEDED = 6;
  ERROR_CODE_RESOURCE_EXHAUSTED = 7;
  ERROR_CODE_INTERNAL = 8;
}

message AmountUnit {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  uint32 decimal_places = 2 [(buf.validate.field).uint32.lte = 9];
}

message RakePolicy {
  uint32 basis_points = 1 [(buf.validate.field).uint32.lte = 10000];
  uint64 cap = 2;
  bool no_flop_no_drop = 3;
}

message StraddlePolicy {
  bool enabled = 1;
  uint64 amount = 2;
  optional uint32 seat = 3 [(buf.validate.field).uint32.lte = 9];
}

message GameDefinition {
  GameVariant variant = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  BettingStructure betting_structure = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  GameType game_type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint32 table_capacity = 4 [(buf.validate.field).uint32 = {
    gte: 2
    lte: 10
  }];
  AmountUnit amount_unit = 5 [(buf.validate.field).required = true];
  uint64 small_blind = 6;
  uint64 big_blind = 7 [(buf.validate.field).uint64.gt = 0];
  uint64 ante = 8;
  uint64 button_ante = 9;
  optional RakePolicy rake = 10;
  optional StraddlePolicy straddle = 11;
}

message Card {
  Rank rank = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  Suit suit = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message PlayerState {
  string player_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint32 seat = 2 [(buf.validate.field).uint32.lte = 9];
  uint64 stack = 3;
  uint64 street_committed = 4;
  PlayerStatus status = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message ForcedContribution {
  string player_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ForcedContributionType type = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint64 amount = 3 [(buf.validate.field).uint64.gt = 0];
}

message ActionEvent {
  uint64 sequence = 1;
  Street street = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string actor_player_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  ActionType action = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional uint64 incremental_amount = 5;
  optional uint64 target_total = 6;
  uint64 pot_before = 7;
  uint64 stack_after = 8;
  bool all_in = 9;
}

message SidePot {
  uint64 amount = 1 [(buf.validate.field).uint64.gt = 0];
  repeated string eligible_player_ids = 2 [(buf.validate.field).repeated = {
    min_items: 2
    unique: true
  }];
}

message PotState {
  uint64 pot_total = 1;
  uint64 main_pot = 2;
  repeated SidePot side_pots = 3;
}

message LegalAction {
  ActionType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional uint64 min_target_total = 2;
  optional uint64 max_target_total = 3;
  bool all_in_only = 4;
}

message HandState {
  GameDefinition game = 1 [(buf.validate.field).required = true];
  string hand_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint64 decision_index = 3;
  Street street = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint32 button_seat = 5 [(buf.validate.field).uint32.lte = 9];
  string hero_player_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated PlayerState players = 7 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 10
  }];
  repeated Card hero_hole_cards = 8 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 2
  }];
  repeated Card board = 9 [(buf.validate.field).repeated.max_items = 5];
  PotState pot = 10 [(buf.validate.field).required = true];
  repeated ForcedContribution forced_contributions = 11;
  repeated ActionEvent action_history = 12;
  repeated LegalAction legal_actions = 13 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 5
  }];
  uint64 to_call = 14;
}

message DecisionOptions {
  string strategy_profile = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  uint32 solve_time_budget_ms = 2 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 120000
  }];
  uint64 seed = 3;
  bool include_sampled_action = 4;
  bool include_full_strategy = 5;
  SolverMode solver_mode = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // Caller-provided preflop effective-stack depth in big blinds, a heuristic
  // hint for the <=12 big-blind short-stack strategy. When absent the host
  // reconstructs a physical approximation from structured chips (minimum of
  // hero and shortest live opponent, or hero depth in multiway hands); clients
  // with the platform-computed value should send it for exact parity. When
  // present it must be positive and within a sane table-depth bound.
  optional double preflop_effective_stack_bb = 7;
}

message DecisionRequest {
  HandState state = 1 [(buf.validate.field).required = true];
  DecisionOptions options = 2 [(buf.validate.field).required = true];
}

message ActionPolicy {
  ActionType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional uint64 target_total = 2;
  bool all_in = 3;
  double probability = 4 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  optional sint64 expected_value = 5;
}

message SelectedAction {
  ActionType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  optional uint64 target_total = 2;
  bool all_in = 3;
}

message SolverMetadata {
  SolverSource source = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint64 solve_time_us = 2;
  optional double equity = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  optional double minimum_defense_frequency = 4 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  optional double exploitability = 5 [(buf.validate.field).double.gte = 0];
  bool cache_hit = 6;
  string reason_code = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string diagnostic_reason = 8 [(buf.validate.field).string.max_len = 512];
  // Negotiated minor 1 only. Lowercase hex SHA-256 of the immutable resident
  // policy artifact bytes that produced the row.
  optional string artifact_sha256 = 9 [(buf.validate.field).string = {pattern: "^[a-f0-9]{64}$"}];
  // Negotiated minor 1 only. What the host certifies about a distribution:
  //   modeled_exact_bound - passed modeled certification bounds (never emitted
  //                         before certification exists);
  //   uncertified         - a complete, validated blueprint without bounds;
  //   baseline            - reserved for a future resolving-deadline fallback.
  optional string guarantee = 10 [(buf.validate.field).string = {
    in: [
      "modeled_exact_bound",
      "uncertified",
      "baseline"
    ]
  }];
}

message Strategy {
  repeated ActionPolicy actions = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 5
  }];
  optional SelectedAction selected_action = 2;
  SolverMetadata solver = 3 [(buf.validate.field).required = true];
}

// Negotiated minor 1 only. The full resident blueprint distribution: unlike
// the minor-0 Strategy the action list carries up to 32 abstract actions and
// is never truncated to five.
message ExpandedStrategy {
  repeated ActionPolicy actions = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
  optional SelectedAction selected_action = 2;
  SolverMetadata solver = 3 [(buf.validate.field).required = true];
}

message FieldViolation {
  string field_path = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string description = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message EngineError {
  ErrorCode code = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string message = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  bool retryable = 3;
  repeated FieldViolation violations = 4;
}

message DecisionResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    Strategy strategy = 1;
    EngineError error = 2;
    // Negotiated minor 1 only; never set on a minor-0 response.
    ExpandedStrategy expanded_strategy = 3;
  }
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  repeated uint32 supported_protocol_minors = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
  string engine_build_version = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated GameVariant supported_game_variants = 3 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
  repeated BettingStructure supported_betting_structures = 4 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
  uint32 minimum_players = 5 [(buf.validate.field).uint32.gte = 2];
  uint32 maximum_players = 6 [(buf.validate.field).uint32.lte = 10];
  repeated Street supported_streets = 7 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
  repeated ActionType supported_actions = 8 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
  AmountSemantics amount_semantics = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  repeated SolverMode solver_modes = 10 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
  repeated string strategy_profiles = 11 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
  FeatureSupport exact_lp = 12 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  FeatureSupport dcfr = 13 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  FeatureSupport multistreet = 14 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  FeatureSupport side_pots = 15 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  FeatureSupport rake = 16 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  FeatureSupport tournament_icm = 17 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  uint64 maximum_request_bytes = 18 [(buf.validate.field).uint64 = {
    gt: 0
    lte: 1048576
  }];
  uint32 maximum_solve_time_ms = 19 [(buf.validate.field).uint32.gt = 0];
}

message Envelope {
  uint32 protocol_minor = 1;
  string request_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  oneof payload {
    option (buf.validate.oneof).required = true;
    GetCapabilitiesRequest get_capabilities_request = 10;
    GetCapabilitiesResponse get_capabilities_response = 11;
    DecisionRequest decision_request = 12;
    DecisionResponse decision_response = 13;
  }
}
