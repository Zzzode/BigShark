version: v2
clean: true
inputs:
  - directory: proto
plugins:
  - protoc_builtin: cpp
    protoc_path: .tools/protobuf/36.1/bin/protoc
    out: build/generated/cpp
    include_imports: true
  - local: node_modules/.bin/protoc-gen-es
    out: build/generated/ts
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
      - json_types=true
      - valid_types=protovalidate_required
