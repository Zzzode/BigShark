name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build verification image
        run: docker build -f tools/ci/Dockerfile.linux -t bigshark-linux-verify:ci .

      - name: Run verification
        run: docker run --rm bigshark-linux-verify:ci
